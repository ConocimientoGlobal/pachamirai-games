<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pachamirai Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #6366f1; font-family: monospace; font-size: 16px; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="loading">Cargando...</div>
<script>
// PACHAMIRAI GAMES v3.0 — SOLO ANDROID | TÁCTIL
const W=480,H=270,T=16;
let cv,ctx,state='menu',player,world,inventory,stats,clock;
let touch={active:false,bx:0,by:0,dx:0,dy:0,id:null};
let particles=[];

const S={};
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c}
function fr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function ci(cx,cy,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill()}
function el(cx,cy,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,7);ctx.fill()}

function initSprites(){
    // Terreno
    S.grass=mk(16,16,(x,w,h)=>{fr(0,0,w,h,'#3d6b22');fr(2,2,3,3,'#4a7c2c');fr(8,5,2,3,'#5a8c3c');fr(11,9,3,2,'#4a7c2c')});
    S.grass_tall=mk(16,16,(x,w,h)=>{fr(0,0,w,h,'#3d6b22');for(let i=0;i<4;i++)fr(i*4,2,2,12,'#5a9c3c')});
    S.dirt=mk(16,16,(x,w,h)=>{fr(0,0,w,h,'#8b6b3a');fr(3,3,3,2,'#7a5a2a');fr(9,7,4,2,'#7a5a2a')});
    S.sand=mk(16,16,(x,w,h)=>{fr(0,0,w,h,'#d4b896');fr(2,4,2,2,'#c4a886');fr(8,8,3,2,'#c4a886')});
    S.stone=mk(16,16,(x,w,h)=>{fr(0,0,w,h,'#7a7a7a');fr(2,2,4,3,'#8a8a8a');fr(8,6,5,3,'#6a6a6a')});
    S.water=mk(16,16,(x,w,h)=>{fr(0,0,w,h,'#2a5a8a');fr(0,2,w,2,'#3a6a9a');fr(0,7,w,2,'#3a7aaa');fr(2,4,3,1,'#5a9aca')});
    
    // Vegetación
    S.oak=mk(48,64,(x,w,h)=>{el(24,56,18,6,'rgba(0,0,0,0.2)');fr(18,36,12,28,'#6b4a2a');el(24,22,18,14,'#2d5a1c');el(20,18,12,10,'#3a6a2a');el(18,12,8,8,'#4a7c3a')});
    S.pine=mk(48,64,(x,w,h)=>{el(24,56,16,6,'rgba(0,0,0,0.2)');fr(20,36,8,28,'#5a3a1a');fr(8,8,32,8,'#1a3a0a');fr(12,14,24,8,'#2a4a1a');fr(16,20,16,8,'#3a5a2a')});
    S.rock_s=mk(16,16,(x,w,h)=>{el(8,10,6,5,'#8a8a8a');el(7,9,3,2,'#9a9a9a')});
    S.rock_l=mk(24,24,(x,w,h)=>{el(12,14,10,8,'#7a7a7a');el(10,12,6,5,'#8a8a8a')});
    S.bush=mk(32,24,(x,w,h)=>{el(16,16,14,8,'#2a4a1a');el(14,14,8,5,'#3a5a2a')});
    S.flower_r=mk(16,16,(x,w,h)=>{fr(7,10,2,6,'#2a4a1a');ci(7,7,3,'#e74c3c')});
    S.flower_y=mk(16,16,(x,w,h)=>{fr(7,10,2,6,'#2a4a1a');ci(7,7,3,'#f1c40f')});
    S.flower_b=mk(16,16,(x,w,h)=>{fr(7,10,2,6,'#2a4a1a');ci(7,7,3,'#3498db')});
    
    // Edificios
    S.house=mk(64,64,(x,w,h)=>{el(32,58,28,6,'rgba(0,0,0,0.2)');fr(8,24,48,32,'#b8945a');fr(4,20,56,8,'#8b4513');fr(26,38,12,18,'#5a3a1a');fr(12,30,8,8,'#a8d8ea');fr(44,30,8,8,'#a8d8ea')});
    
    // Animales
    S.rabbit=mk(16,16,(x,w,h)=>{el(8,10,5,4,'#f5f5dc');el(10,7,3,3,'#f5f5dc');fr(9,4,2,3,'#f5f5dc');ci(11,6,1,'#ff9999')});
    S.fox=mk(32,24,(x,w,h)=>{el(16,14,10,6,'#e67e22');fr(24,8,8,8,'#e67e22');fr(28,10,6,5,'#d35400');ci(27,10,1,'#fff');fr(10,18,3,6,'#d35400');fr(18,18,3,6,'#d35400');fr(2,10,6,4,'#e67e22');fr(0,10,4,3,'#fff')});
    S.bird=mk(16,16,(x,w,h)=>{el(8,8,5,4,'#3498db');fr(13,8,3,2,'#f39c12');ci(11,6,1,'#fff');fr(4,8,4,2,'#2471a3')});
    S.deer=mk(48,32,(x,w,h)=>{el(24,18,14,8,'#a08060');fr(10,8,4,10,'#907050');el(8,6,6,5,'#907050');ci(6,5,1,'#2c1810');fr(6,0,2,6,'#5a3a1a');fr(4,-2,2,4,'#5a3a1a');fr(8,-2,2,4,'#5a3a1a');fr(14,24,3,8,'#705030');fr(22,24,3,8,'#705030');fr(34,24,3,8,'#705030');fr(40,24,3,8,'#705030')});
    
    // Jugador
    S.p_idle=mk(24,32,(x,w,h)=>{el(12,28,8,3,'rgba(0,0,0,0.3)');fr(7,22,4,8,'#5d4037');fr(13,22,4,8,'#5d4037');fr(5,10,14,14,'#6366f1');fr(7,12,10,10,'#7c83f5');ci(12,7,6,'#f4c28f');fr(9,6,2,2,'#2c3e50');fr(13,6,2,2,'#2c3e50');fr(8,2,8,3,'#4a3728')});
    S.p_walk=mk(24,32,(x,w,h)=>{el(12,28,8,3,'rgba(0,0,0,0.3)');fr(5,22,4,8,'#5d4037');fr(15,22,4,8,'#5d4037');fr(5,10,14,14,'#6366f1');fr(7,12,10,10,'#7c83f5');ci(12,7,6,'#f4c28f');fr(9,6,2,2,'#2c3e50');fr(13,6,2,2,'#2c3e50');fr(8,2,8,3,'#4a3728')});
    
    // UI
    S.icon_hp=mk(12,12,(x,w,h)=>{fr(1,3,4,3,'#e74c3c');fr(7,3,4,3,'#e74c3c');fr(2,2,3,2,'#e74c3c');fr(7,2,3,2,'#e74c3c');fr(3,5,6,3,'#e74c3c');fr(4,7,4,2,'#e74c3c');fr(5,9,2,1,'#e74c3c')});
    S.icon_nrg=mk(12,12,(x,w,h)=>{fr(5,1,2,3,'#f1c40f');fr(4,3,4,6,'#f1c40f');fr(3,5,6,3,'#f39c12')});
    S.shadow=mk(16,8,(x,w,h)=>{el(8,4,6,3,'rgba(0,0,0,0.3)')});
    S.joy_base=mk(80,80,(x,w,h)=>{el(40,40,35,35,'rgba(255,255,255,0.1)');el(40,40,30,30,'rgba(255,255,255,0.15)')});
    S.joy_knob=mk(24,24,(x,w,h)=>{el(12,12,10,10,'rgba(255,255,255,0.5)');el(12,12,6,6,'rgba(255,255,255,0.7)')});
    S.btn_e=mk(32,22,(x,w,h)=>{fr(0,0,w,h,'rgba(99,102,241,0.6)');fr(1,1,w-2,h-2,'rgba(99,102,241,0.4)')});
    S.btn_at=mk(32,22,(x,w,h)=>{fr(0,0,w,h,'rgba(231,76,60,0.6)');fr(1,1,w-2,h-2,'rgba(231,76,60,0.4)')});
}

// CHUNKS
function genChunk(cx,cy){
    const key=cx+','+cy;
    if(world.chunks[key])return;
    const objs=[];
    let seed=cx*7919+cy*104729;
    const rng=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
    
    for(let y=0;y<16;y++)for(let x=0;x<16;x++){
        const wx=cx*16+x,wy=cy*16+y;
        const n=Math.sin(wx*0.08)*Math.cos(wy*0.08);
        const xp=wx*T,yp=wy*T;
        if(n>0.4){if(rng()<0.12)objs.push({t:rng()<0.7?'oak':'pine',x:xp,y:yp,hp:3});else if(rng()<0.06)objs.push({t:'bush',x:xp,y:yp,hp:1})}
        else if(n>0.1){if(rng()<0.1)objs.push({t:'grass_tall',x:xp,y:yp,hp:1});else if(rng()<0.04)objs.push({t:['flower_r','flower_y','flower_b'][Math.floor(rng()*3)],x:xp,y:yp,hp:1})}
        else if(n>-0.1){if(rng()<0.06)objs.push({t:rng()<0.5?'rock_s':'rock_l',x:xp,y:yp,hp:2})}
        if(n<-0.3)objs.push({t:'water',x:xp,y:yp,hp:0});
    }
    
    const animals=[];
    if(rng()<0.3){
        const types=['rabbit','bird','fox'];
        animals.push({t:types[Math.floor(rng()*3)],x:(cx*16+rng()*16)*T,y:(cy*16+rng()*16)*T,state:'idle',hp:15,dir:rng()*7,timer:0});
    }
    world.chunks[key]={objs,animals};
}

function updateChunks(){
    const pcx=Math.floor(player.x/256),pcy=Math.floor(player.y/256);
    for(let x=pcx-4;x<=pcx+4;x++)for(let y=pcy-4;y<=pcy+4;y++)genChunk(x,y);
}

// RENDER
function render(){
    const cx=player.x-W/2,cy=player.y-H/2;
    ctx.fillStyle='#1a3d1a';ctx.fillRect(0,0,W,H);
    
    // Terreno base
    const sx=Math.floor(cx/T)-1,sy=Math.floor(cy/T)-1;
    for(let x=sx;sx+W/T+3>x;x++)for(let y=sy;sy+H/T+3>y;y++){
        const n=Math.sin(x*0.08)*Math.cos(y*0.08);
        ctx.drawImage(n<-0.3?S.water:n<-0.1?S.stone:n<0.1?S.sand:S.grass,x*T-cx,y*T-cy);
    }
    
    // Objetos
    for(const k in world.chunks){
        const ch=world.chunks[k];
        for(const o of ch.objs){
            const sx=o.x-cx,sy=o.y-cy;
            if(sx<-64||sx>W+64||sy<-64||sy>H+64)continue;
            const sp=S[o.t];if(sp)ctx.drawImage(sp,sx,sy);
        }
        for(const a of ch.animals){
            const sx=a.x-cx,sy=a.y-cy;
            if(sx<-32||sx>W+32||sy<-32||sy>H+32)continue;
            const sp=S[a.t];if(sp)ctx.drawImage(sp,sx-sp.width/2,sy-sp.height/2);
        }
    }
    
    // Jugador
    ctx.drawImage(player.moving?S.p_walk:S.p_idle,player.x-cx-12,player.y-cy-16);
    
    // Partículas
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
        if(p.life<=0){particles.splice(i,1);continue;}
        ctx.globalAlpha=p.life/p.max;
        ci(p.x-cx,p.y-cy,2,p.col);
        ctx.globalAlpha=1;
    }
    
    drawHUD();
}

function drawHUD(){
    fr(8,8,50,6,'#424242');fr(8,8,50*(stats.hp/stats.mhp),6,'#e74c3c');
    ctx.drawImage(S.icon_hp,2,2,12,12);
    fr(8,18,50,5,'#424242');fr(8,18,50*(stats.nrg/stats.mnrg),5,'#42a5f5');
    ctx.drawImage(S.icon_nrg,2,14,12,12);
    
    const h=Math.floor(clock.time),m=Math.floor((clock.time-h)*60);
    ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText(`Día ${clock.day} ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`,W/2,12);
    
    fr(W-42,8,34,34,'rgba(0,0,0,0.7)');fr(W-40,10,30,30,'#1a3d1a');fr(W-26,22,4,4,'#6366f1');
    
    for(let i=0;i<6;i++)fr(20+i*32,H-25,28,20,'rgba(45,45,68,0.8)');
    
    if(touch.active){
        ctx.drawImage(S.joy_base,touch.bx-40,touch.by-40);
        ctx.drawImage(S.joy_knob,touch.bx+touch.dx-12,touch.by+touch.dy-12);
    }
    
    ctx.drawImage(S.btn_e,W-80,H-55);ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText('E',W-64,H-42);
    ctx.drawImage(S.btn_at,W-44,H-55);
    ctx.fillText('AT',W-28,H-42);
}

function drawMenu(){
    ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
    for(let i=0;i<40;i++){ctx.fillStyle=`rgba(255,235,59,${0.2+Math.random()*0.4})`;ctx.fillRect(Math.random()*W,Math.random()*H,2,2)}
    
    ctx.fillStyle='#6366f1';ctx.font='bold 28px monospace';ctx.textAlign='center';
    ctx.fillText('PACHAMIRAI',W/2,50);
    ctx.fillStyle='#aaa';ctx.font='10px monospace';
    ctx.fillText('Los Herederos de Pachamirai',W/2,75);
    ctx.fillText('La Primera Semilla',W/2,90);
    
    ctx.drawImage(S.p_idle,W/2-12,110,48,64);
    
    fr(W/2-50,180,100,30,'#6366f1');ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText('JUGAR',W/2,200);
    fr(W/2-50,220,100,25,'#2ecc71');ctx.font='bold 12px monospace';ctx.fillText('CONTINUAR',W/2,237);
    
    ctx.fillStyle='#555';ctx.font='8px monospace';ctx.fillText('Solo Android',W/2,H-10);
}

// INPUT
function setupInput(){
    cv.addEventListener('touchstart',e=>{
        e.preventDefault();
        const r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
        for(let i=0;i<e.changedTouches.length;i++){
            const t=e.changedTouches[i];
            const cx=(t.clientX-r.left)*sx,cy=(t.clientY-r.top)*sy;
            if(cx<W*0.5){touch.active=true;touch.bx=cx;touch.by=cy;touch.dx=0;touch.dy=0;touch.id=t.identifier}
            else{
                if(cx>W-80&&cy>H-55)buttons.interact=true;
                if(cx>W-44&&cy>H-55)buttons.attack=true;
                if(state==='menu'){
                    if(cx>W/2-60&&cx<W/2+60&&cy>175&&cy<255)startGame();
                }
            }
        }
    },false);
    
    cv.addEventListener('touchmove',e=>{
        e.preventDefault();
        const r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
        for(let i=0;i<e.changedTouches.length;i++){
            const t=e.changedTouches[i];
            if(t.identifier===touch.id){
                const cx=(t.clientX-r.left)*sx,cy=(t.clientY-r.top)*sy;
                touch.dx=cx-touch.bx;touch.dy=cy-touch.by;
                const d=Math.sqrt(touch.dx**2+touch.dy**2);
                if(d>40){touch.dx=(touch.dx/d)*40;touch.dy=(touch.dy/d)*40}
            }
        }
    },false);
    
    cv.addEventListener('touchend',e=>{
        e.preventDefault();
        for(let i=0;i<e.changedTouches.length;i++)
            if(e.changedTouches[i].identifier===touch.id){touch.active=false;touch.dx=0;touch.dy=0}
    },false);
}

// GAME
function startGame(){
    state='game';player={x:800,y:800,dir:'down',moving:false};
    world={day:1,time:8,season:0,chunks:{}};
    inventory=[{id:'wood',q:5},{id:'stone',q:3},{id:'herb',q:2},{id:'fiber',q:4}];
    stats={hp:100,mhp:100,nrg:100,mnrg:100,str:5,lv:1,xp:0,xpN:100};
    clock={time:8,day:1,season:0};particles=[];updateChunks();
}

function interact(){
    let near=null,minD=35;
    for(const k in world.chunks){
        const ch=world.chunks[k];
        for(const o of ch.objs){
            if(o.hp<=0)continue;
            const d=Math.sqrt((o.x-player.x)**2+(o.y-player.y)**2);
            if(d<minD){minD=d;near=o}
        }
    }
    if(near){
        if(near.t==='oak'||near.t==='pine'){near.hp--;particles.push({x:near.x,y:near.y,vx:0,vy:-1,life:20,max:20,col:'#8b5a2b'});if(near.hp<=0){inventory.push({id:'wood',q:2});removeObj(near)}}
        else if(near.t==='rock_s'||near.t==='rock_l'){near.hp--;particles.push({x:near.x,y:near.y,vx:0,vy:-1,life:20,max:20,col:'#7a7a7a'});if(near.hp<=0){inventory.push({id:'stone',q:2});removeObj(near)}}
        else if(near.t==='grass_tall'||near.t.includes('flower')||near.t==='bush'){inventory.push({id:'herb',q:1});particles.push({x:near.x,y:near.y,vx:0,vy:-1,life:20,max:20,col:'#27ae60'});removeObj(near)}
    }
}

function removeObj(o){
    for(const k in world.chunks){
        const i=world.chunks[k].objs.indexOf(o);if(i>=0){world.chunks[k].objs.splice(i,1);return}
    }
}

function attack(){
    let near=null,minD=45;
    for(const k in world.chunks){
        for(const a of world.chunks[k].animals){
            const d=Math.sqrt((a.x-player.x)**2+(a.y-player.y)**2);
            if(d<minD){minD=d;near=a}
        }
    }
    if(near){near.hp-=stats.str+5;particles.push({x:near.x,y:near.y,vx:0,vy:-1,life:15,max:15,col:'#e74c3c'});if(near.hp<=0){inventory.push({id:'meat',q:1});near.dead=true}}
    for(const k in world.chunks)world.chunks[k].animals=world.chunks[k].animals.filter(a=>!a.dead);
}

function update(){
    if(state==='menu')return;
    const dx=touch.dx/40,dy=touch.dy/40;
    if(Math.abs(dx)>0.1||Math.abs(dy)>0.1){player.x+=dx*2;player.y+=dy*2;player.moving=true}
    else player.moving=false;
    
    updateChunks();clock.time+=0.002;if(clock.time>=24){clock.time-=24;clock.day++}
    if(buttons.interact){interact();buttons.interact=false}
    if(buttons.attack){attack();buttons.attack=false}
}

function loop(){
    update();
    if(state==='menu')drawMenu();else render();
    requestAnimationFrame(loop);
}

function init(){
    cv=document.getElementById('c');ctx=cv.getContext('2d');cv.width=W;cv.height=H;
    const s=Math.min(window.innerWidth/W,window.innerHeight/H);
    cv.style.width=W*s+'px';cv.style.height=H*s+'px';
    document.getElementById('loading').style.display='none';
    initSprites();setupInput();loop();
}

window.onload=init;
window.onresize=()=>{const s=Math.min(window.innerWidth/W,window.innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'};
</script>
</body>
</html>
